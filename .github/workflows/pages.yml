name: Deploy Affiliate Agent OS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check app.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          const refs = [...js.matchAll(/\$\("#([^"]+)"\)|querySelector\("#([^"]+)"\)/g)].map(m => m[1] || m[2]);
          const missing = [...new Set(refs.filter(id => !ids.includes(id)))];
          if (duplicates.length || missing.length) {
            console.error(JSON.stringify({ duplicates, missing }, null, 2));
            process.exit(1);
          }
          console.log('Frontend syntax and selector checks passed.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
